name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application executable
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --icon "Icono Fashion Reset.ico" `
            --name "Fashion Reset" `
            app_visual.py

      - name: Build launcher executable
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --icon "Icono Fashion Reset.ico" `
            --name "Fashion Reset Launcher" `
            launcher.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
